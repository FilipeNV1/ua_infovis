<svg width="500" height="400">
    <title> Exercise 1 </title>
    <desc> SVG First Example </desc>
    <rect x="80" y="50" width="400" height="250" stroke="black" fill="transparent"/>
    <rect x="200" y="100" width="100" height="100" stroke="lightgrey" stroke-width="2" fill="black"/> 
    <rect x="220" y="120" width="100" height="100" stroke="black" stroke-width="2" fill="lightgrey" opacity="0.75"/> 
    <rect x="240" y="140" width="100" height="100" stroke="red" stroke-width="10" stroke-dasharray="10" fill="green" fill-opacity="0.5"/>
</svg>

<svg width="500" height="400">
    <title> Exercise 2.1 </title>
    <desc> SVG Second Example </desc>
    <rect x="150" y="150" width="200" height="100" ry="20" stroke="black" stroke-width="2" fill="transparent"/>
    <ellipse cx="190" cy="200" rx="80" ry="50" stroke="black" stroke-width="2" fill="lightgrey"/>
    <circle cx="175" cy="200" r="50" stroke="white" fill="white"/>
    <rect x="100" y="100" width="100" height="200" rx="20" fill="green"/>
</svg>

<svg width="500" height="400">
    <path d="M 80 180 L 50 120 L 80 60 L 90 40 L 80 20 L 120 20 L 110 40 L 120 60 L 150 120 L 120 180 z"
    fill="transparent" stroke="black" stroke-width="2"/>
</svg>

<svg width="500" height="400">
  <path d="M 80 180 Q 50 120 80 60 Q 90 40 80 20 L 120 20 Q 110 40 120 60 Q 150 120 120 180 z"
  fill="green" stroke="black" stroke-width="1" stroke-dasharray="5"/>
</svg>
